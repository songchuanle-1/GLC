[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiview-rpm"
version = "0.1.0"
description = "Recurrent phrase memory and controlled ablations for multiview referring segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Chuanle Song"}]
dependencies = ["torch>=2.5,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/songchuanle-1/RPM"
Issues = "https://github.com/songchuanle-1/RPM/issues"

[tool.setuptools.packages.find]
include = ["rpm*"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
